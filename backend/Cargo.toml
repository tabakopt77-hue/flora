
[package]
name = "bloom-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web Framework
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1.0", features = ["full"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace", "limit"] }

# Database & Cache
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "uuid", "time", "chrono", "rust_decimal"] }
redis = { version = "0.24", features = ["tokio-comp"] }
qdrant-client = "1.7"

# Serialization & Logic
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }
time = "0.3"
rust_decimal = { version = "1.33", features = ["db-postgres", "serde-float"] }

# Security
argon2 = "0.5"
jsonwebtoken = "9.2"
rand = "0.8"

# Utilities
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.11", features = ["json", "multipart", "rustls-tls"] }
thiserror = "1.0"
anyhow = "1.0"
base64 = "0.21"
