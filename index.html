
<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aura Flora - Маркетплейс цветов с ИИ</title>
    <meta name="description" content="Aura Flora — цветочный маркетплейс с умным ИИ-флористом. Идеальные букеты для ваших чувств." />
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&family=Caveat:wght@400..700&family=Great+Vibes&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              serif: ['Playfair Display', 'serif'],
              cursive: ['Caveat', 'cursive'],
              script: ['Great Vibes', 'cursive'],
            },
            colors: {
              aura: {
                bg: '#022B1E',
                green: '#63b388',
                text: '#a0b8ac',
              },
              sage: {
                50: '#f4f7f4',
                100: '#e3ebe3',
                200: '#c5d8c5',
                300: '#9dbf9d',
                500: '#6b9c6b',
                800: '#3a5a3a',
                900: '#2f482f',
              },
              rose: {
                50: '#fff1f2',
                100: '#ffe4e6',
                200: '#fecdd3',
                300: '#fda4af',
                500: '#f43f5e',
                900: '#881337',
              }
            },
            animation: {
              'marquee': 'marquee 20s linear infinite',
              'shimmer': 'shimmer 15s ease infinite',
            },
            keyframes: {
              marquee: {
                '0%': { transform: 'translateX(0%)' },
                '100%': { transform: 'translateX(-50%)' },
              },
              shimmer: {
                '0%, 100%': { 'background-position': '0% 50%' },
                '50%': { 'background-position': '100% 50%' },
              }
            }
          }
        }
      }
    </script>
    <style>
      /* Hide scrollbar for Chrome, Safari and Opera */
      .no-scrollbar::-webkit-scrollbar {
          display: none;
      }
      /* Hide scrollbar for IE, Edge and Firefox */
      .no-scrollbar {
          -ms-overflow-style: none;  /* IE and Edge */
          scrollbar-width: none;  /* Firefox */
      }
      
      @keyframes aster-colors {
        0% { color: #8b5cf6; filter: drop-shadow(0 0 15px rgba(139, 92, 246, 0.5)); } /* Purple */
        20% { color: #ec4899; filter: drop-shadow(0 0 15px rgba(236, 72, 153, 0.5)); } /* Pink */
        40% { color: #f8fafc; filter: drop-shadow(0 0 15px rgba(248, 250, 252, 0.5)); } /* White */
        60% { color: #3b82f6; filter: drop-shadow(0 0 15px rgba(59, 130, 246, 0.5)); } /* Blue */
        80% { color: #d946ef; filter: drop-shadow(0 0 15px rgba(217, 70, 239, 0.5)); } /* Magenta */
        100% { color: #8b5cf6; filter: drop-shadow(0 0 15px rgba(139, 92, 246, 0.5)); } /* Purple */
      }
      
      .animate-aster {
        animation: aster-colors 10s infinite alternate ease-in-out;
      }
    </style>
</head>
  <body class="bg-sage-50 text-gray-800 antialiased">
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
