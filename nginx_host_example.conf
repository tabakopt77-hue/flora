
# Этот файл для основного Nginx на вашем сервере (Host machine)
# Путь к проекту: /var/www/Aura Flora (цветочный магазин)

server {
    server_name aura-flora.com www.aura-flora.com;

    # Логи
    access_log /var/log/nginx/aura-flora.access.log;
    error_log /var/log/nginx/aura-flora.error.log;

    client_max_body_size 20M;

    location / {
        # Проксируем все запросы на Docker контейнер (порт 8095)
        proxy_pass http://127.0.0.1:8095;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Сертификаты SSL (Certbot настроит это автоматически)
    # listen 443 ssl; 
}
